<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Compare Schemes | One Scheme</title>

    <link rel="icon" href="../images/logo.png">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/compare.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/mobile-enhance.css">
</head>

<body>

    <!-- ==========================
            NAVBAR
    =========================== -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">

        <div class="container">

            <a class="navbar-brand fw-bold text-primary fs-3" href="../index.html">
                <i class="bi bi-bank2"></i>
                One Scheme
            </a>

            <div class="ms-auto">
                <a href="../index.html" class="btn btn-outline-primary home-btn">
                    <i class="bi bi-house-door-fill"></i>
                    Home
                </a>
            </div>

            <div class="ms-auto">
                <a href="results.html" class="btn btn-outline-primary">
                    <i class="bi bi-arrow-left"></i>
                    Back to Results
                </a>
            </div>

            <button id="translateBtn" class="translate-btn notranslate">
                <i class="bi bi-translate"></i>
                <span class="translate-text"></span>
            </button>

        </div>

    </nav>

    <!-- ==========================
            HEADER
    =========================== -->
    <section class="hero-section">

        <div class="container text-center">

            <span class="hero-badge">
                Scheme Comparison
            </span>

            <h1>Compare Schemes</h1>

            <p>
                Compare benefits, eligibility,
                organization, income limits and
                application process side by side.
            </p>

        </div>

    </section>

    <!-- ==========================
            COMPARISON TABLE
    =========================== -->
    <section class="container my-5">

        <div class="table-responsive">

            <table class="table compare-table">

                <tbody id="compareTable">

                </tbody>

            </table>

        </div>

    </section>

    <!-- =======================
     Mobile Bottom Navigation
     (hidden on desktop, see mobile-enhance.css)
======================= -->
    <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
        <a href="../index.html" class="mnav-item" data-match="/index.html,/">
            <i class="bi bi-house-fill"></i>
            <span>Home</span>
        </a>
        <a href="explore.html" class="mnav-item" data-match="explore.html">
            <i class="bi bi-compass-fill"></i>
            <span>Explore</span>
        </a>
        <button type="button" class="mnav-item mnav-role-item" id="mnavRoleButton" onclick="handleMobileRoleAction()">
            <i class="bi bi-box-arrow-in-right"></i>
            <span id="mnavRoleLabel">Login</span>
            <span class="mnav-count" id="mnavSavedCount" style="display:none;"></span>
        </button>
        <button type="button" class="mnav-item mnav-settings-item" id="mnavSettingsButton" onclick="toggleMobileSettings(event)">
            <i class="bi bi-gear-fill"></i>
            <span>Settings</span>
        </button>
    </nav>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/schemes.js"></script>
    <script src="../js/compare.js"></script>
    <script src="../js/mobile-nav.js"></script>
    <script src="../js/profile.js"></script>

    <div id="google_translate_element"></div>
    <script src="../js/translate.js"></script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>

</html>
