<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Schemes</title>

    <link rel="icon" type="image/png" href="../images/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/explore.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a href="../index.html" class="navbar-brand">
                <img src="../images/logo.png" height="45">
                One Nation One Scheme
            </a>

            <div>
                <a href="../index.html" class="btn btn-outline-primary">
                    <i class="bi bi-house"></i>
                    Home
                </a>
            </div>
        </div>
    </nav>

    <!-- HERO -->
    <section class="hero-section">
        <div class="container">
            <h1>Explore Schemes</h1>
            <p>Discover Scholarships, Agriculture, Finance, Employment and Startup Schemes</p>
        </div>
    </section>

    <!-- STATS -->
    <section class="stats">
        <div class="container">
            <div class="row text-center">

                <div class="col-md-3">
                    <div class="stat-card">
                        <h2 id="totalSchemes">0</h2>
                        <p>Schemes</p>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="stat-card">
                        <h2 id="educationCount">0</h2>
                        <p>Education</p>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="stat-card">
                        <h2 id="governmentCount">0</h2>
                        <p>Government</p>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="stat-card">
                        <h2 id="privateCount">0</h2>
                        <p>Private / CSR</p>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- SEARCH -->
    <section class="container mt-5">
        <div class="row">

            <div class="col-lg-8">
                <input
                    id="searchInput"
                    type="text"
                    class="form-control search-box"
                    placeholder="Search Scheme...">
            </div>

            <div class="col-lg-4">
                <select id="categoryFilter" class="form-select">
                    <option value="All">All Categories</option>
                    <option>Education</option>
                    <option>Agriculture</option>
                    <option>Employment</option>
                    <option>Finance</option>
                    <option>Startup</option>
                    <option>Healthcare</option>
                    <option>Housing</option>
                    <option>Women</option>
                </select>
            </div>

        </div>
    </section>

    <!-- SCHEMES -->
    <section class="container my-5">
        <div class="row" id="schemeContainer"></div>
    </section>

    <!-- MODAL -->
    <div class="modal fade" id="schemeModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Scheme</h5>

                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body" id="modalBody"></div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/schemes.js"></script>
    <script src="../js/explore.js"></script>

</body>
</html>
